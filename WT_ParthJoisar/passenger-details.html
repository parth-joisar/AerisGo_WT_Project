<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AerisGo | Passenger Details</title>
<link rel="stylesheet" href="styles.css">
<script src="passenger.js" defer></script>
</head>
<body><div class="internal">
<header class="page-header"><a class="back" href="seat-selection.html">←</a><div class="title">Passenger Details</div><a class="nav-btn session-exit" href="index.html" data-session-logout>↪ &nbsp;Sign out</a></header>
<main class="content"><div class="flow-head"><div><h1>Passenger Details</h1><p>Enter traveller information</p></div><div class="route-pill">1 Passenger</div></div>
<div class="progress"><span class="on"></span><span class="on"></span><span></span><span></span></div>
<form action="booking-confirmation.html" method="post" data-flow="passenger"><section class="info-card"><h3>Passenger 1</h3><div class="form-grid">
<div><label class="flow-label" for="passengerName">Full Name *</label><input id="passengerName" name="name" class="flow-input" value="Demo Passenger" data-session-value="name" minlength="2" maxlength="60" pattern="[A-Za-z][A-Za-z .'-]{1,59}" title="Enter a valid name using letters, spaces, apostrophes, or hyphens." required></div>
<div><label class="flow-label" for="dateOfBirth">Date of Birth *</label><input id="dateOfBirth" name="dateOfBirth" class="flow-input" type="date" required></div>
<div><label class="flow-label" for="passengerGender">Gender *</label><select id="passengerGender" name="gender" class="flow-input" required><option value="" selected disabled>Select gender</option><option>Male</option><option>Female</option><option>Other</option></select></div>
<div><label class="flow-label" for="documentType">Document Type *</label><select id="documentType" name="documentType" class="flow-input" required><option value="" selected disabled>Select document</option><option value="aadhaar">Aadhaar Card</option><option value="passport">Passport</option></select></div>
<div><label class="flow-label" for="documentNumber">Document Number *</label><input id="documentNumber" name="documentNumber" class="flow-input" placeholder="Select a document type first" minlength="6" maxlength="16" pattern="[A-Za-z0-9]{6,16}" title="Select a document type and enter a valid number." required></div>
<div><label class="flow-label" for="passengerEmail">Email (Optional)</label><input id="passengerEmail" name="email" class="flow-input" type="email" maxlength="254" value="passenger@example.com"></div>
<div><label class="flow-label" for="passengerPhone">Phone (Optional)</label><input id="passengerPhone" name="phone" class="flow-input" type="tel" inputmode="numeric" pattern="[0-9]{10}" minlength="10" maxlength="10" data-digits-only placeholder="10-digit phone number" title="Enter exactly 10 digits."></div>
</div></section><button class="primary-action">Continue to Payment</button></form></main></div></body>
</html>
