<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AerisGo | Meal Selection</title>
<link rel="stylesheet" href="styles.css">
<script src="passenger.js" defer></script>
</head>
<body><div class="internal">
<header class="page-header"><a class="back" href="check-in.html">←</a><div class="title">Meal Selection</div><a class="nav-btn session-exit" href="index.html" data-session-logout>↪ &nbsp;Sign out</a></header>
<main class="content"><div class="flow-head"><div><h1>Select Your Meals</h1><p>Choose meals for Ahmedabad → Mumbai</p></div></div>
<form action="baggage-selection.html" data-flow="meals"><section class="info-card"><h3>Available Meals</h3>
<label class="check"><input name="meal" value="Vegetable Sandwich" type="checkbox"><span><b>Vegetable Sandwich</b><br><small class="muted">Fresh sandwich with vegetables</small></span><b style="margin-left:auto">₹250</b></label>
<label class="check"><input name="meal" value="Paneer Meal" type="checkbox"><span><b>Paneer Meal</b><br><small class="muted">Paneer with rice and sides</small></span><b style="margin-left:auto">₹350</b></label>
<label class="check"><input name="meal" value="Fruit Bowl" type="checkbox"><span><b>Fruit Bowl</b><br><small class="muted">Seasonal fresh fruits</small></span><b style="margin-left:auto">₹180</b></label></section>
<button class="primary-action" type="submit">Continue to Baggage</button></form></main></div></body>
</html>
