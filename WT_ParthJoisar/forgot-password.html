<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AerisGo | Forgot Password</title>
<link rel="stylesheet" href="styles.css">
<script src="passenger.js" defer></script>
</head>
<body><div class="internal">
<header class="page-header"><a class="back" href="signin.html">←</a><div class="title">Forgot Password</div><div style="width:95px"></div></header>
<main class="content center"><form id="forgotPasswordForm" class="info-card" action="#" method="post" data-flow="forgot"><div class="success" style="padding:10px 15px 24px"><h1>Forgot Password?</h1><p>Enter your email address and continue to reset your password.</p><p class="muted">Demo reset is saved in this browser; no email is sent.</p></div><label class="flow-label" for="resetEmail">Email</label><input id="resetEmail" name="email" class="flow-input" type="email" autocomplete="email" maxlength="254" placeholder="m@example.com" required><p id="forgotPasswordMessage" class="form-message" role="alert"></p><button class="primary-action" type="submit">Continue</button></form></main></div></body>
</html>
