<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AerisGo | Reset Password</title>
<link rel="stylesheet" href="styles.css">
<script src="passenger.js" defer></script>
</head>
<body><div class="internal">
<header class="page-header"><a class="back" href="forgot-password.html">←</a><div class="title">Reset Password</div><div style="width:95px"></div></header>
<main class="content center"><form id="resetPasswordForm" class="info-card" action="#" method="post" data-flow="reset-password"><div class="success" style="padding:10px 15px 24px"><h1>Reset Password</h1><p>Create a new password for your AerisGo account.</p><p class="muted">This static demo updates the password stored for this browser only.</p></div><label class="flow-label" for="newPassword">New Password</label><input id="newPassword" name="password" class="flow-input" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" maxlength="72" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,72}" title="Use at least 8 characters, including a letter and a number." required><br><br><label class="flow-label" for="confirmPassword">Confirm Password</label><input id="confirmPassword" name="confirmPassword" class="flow-input" type="password" autocomplete="new-password" placeholder="Re-enter your password" minlength="8" maxlength="72" required><p class="form-message" id="resetPasswordMessage" role="alert"></p><br><button class="primary-action" type="submit">Reset Password</button></form></main></div></body>
</html>
